<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Products - AC Retail</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- HEADER -->

  <header class="header">

    <div class="header-inner">

      <div>

        <div class="logo">
          🛒 AC Retail
        </div>

        <div class="tagline">
          Fresh Groceries • Better Living
        </div>

      </div>


      <nav>

        <a href="index.html">
          Home
        </a>

        <a
          href="products.html"
          class="active"
        >
          Products
        </a>

        <a href="cart.html">
          🛒 Cart
        </a>

        <a href="about.html">
          About
        </a>

        <a href="offers.html">
          Offers
        </a>

        <a href="contact.html">
          Contact
        </a>

      </nav>

    </div>

  </header>



  <!-- PRODUCTS PAGE -->

  <main class="products-page container">


    <!-- PAGE HEADING -->

    <div class="products-heading">

      <span class="section-badge">
        🛒 AC RETAIL
      </span>

      <h1>
        Shop Our Products
      </h1>

      <p>
        Fresh groceries & daily essentials at great prices
      </p>

    </div>



    <!-- SEARCH -->

    <div class="product-search-box">

      <span>
        🔎
      </span>

      <input
        type="text"
        id="search"
        placeholder="Search products, brands..."
        autocomplete="off"
      >

    </div>



    <!-- BRAND FILTER -->

    <div class="filter-section">

      <h3>
        🏷️ Brands
      </h3>

      <div
        class="filters"
        id="brandFilters"
      ></div>

    </div>



    <!-- CATEGORY FILTER -->

    <div class="filter-section">

      <h3>
        📦 Categories
      </h3>

      <div
        class="filters"
        id="categoryFilters"
      ></div>

    </div>



    <!-- PRODUCT LIST -->

    <div
      id="productList"
      class="product-grid"
    ></div>


  </main>



  <!-- FOOTER -->

  <footer class="footer">

    <p>
      &copy; 2026 AC Retail | Police Line, Phaltan
    </p>

    <p>
      📞 8830300826
    </p>

  </footer>



  <!-- PRODUCT JAVASCRIPT -->

  <script src="products.js?v=7"></script>


</body>

</html>
