<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products - AC Retail</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .product-image {
            width: 100%;
            height: 180px;
            background: #f3f3f3;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .no-image {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: #777;
            font-size: 18px;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 15px 0;
        }

        .filter-btn,
        .cat-btn {
            cursor: pointer;
        }
    </style>
</head>

<body>

<header class="header">

    <div class="header-inner">

        <div>
            <div class="logo">🛒 AC Retail</div>

            <div class="tagline">
                Fresh Groceries • Better Living
            </div>
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="products.html" class="active">
                Products
            </a>

            <a href="cart.html">
                🛒 Cart
            </a>

            <a href="about.html">
                About
            </a>

            <a href="offers.html">
                Offers
            </a>

            <a href="contact.html">
                Contact
            </a>

        </nav>

    </div>

</header>

<section class="container">

    <div style="text-align:center; margin-bottom:25px;">

    <h1>🛍️ Shop Our Products</h1>

    <p style="
        color:#68766d;
        margin-top:6px;
    ">
        Find your daily grocery essentials at great prices
    </p>

</div>

<input
    type="text"
    id="search"
    placeholder="🔎 Search products..."
>

    <!-- BRANDS -->
    <h3>Brands</h3>

    <div class="filters" id="brandFilters"></div>

    <!-- CATEGORIES -->
    <h3>Categories</h3>

    <div class="filters" id="categoryFilters"></div>

    <!-- PRODUCTS -->
    <div id="productList" class="product-grid"></div>

</section>

<footer class="footer">

    <p>&copy; 2026 AC Retail | Police Line, Phaltan</p>

    <p>📞 8830300826</p>

</footer>

<script src="products.js?v=6"></script>

</body>
</html>
