<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AC Retail Admin</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background: #f5f8f6;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .admin-header {
      background: linear-gradient(135deg, #087f46, #12a05a);
      color: white;
      padding: 28px 20px;
      text-align: center;
    }

    .admin-header h1 {
      margin: 0;
      font-size: 30px;
    }

    .admin-container {
      max-width: 1200px;
      margin: auto;
      padding: 30px 15px;
    }

    .admin-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      padding: 22px;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,.07);
      text-align: center;
    }

    .stat-card h2 {
      margin: 0;
      font-size: 30px;
      color: #087f46;
    }

    .stat-card p {
      margin: 8px 0 0;
      color: #666;
    }

    .admin-section {
      background: white;
      padding: 25px;
      border-radius: 20px;
      margin-bottom: 25px;
      box-shadow: 0 8px 25px rgba(0,0,0,.06);
    }

    .admin-section h2 {
      margin-top: 0;
    }

    .order-search {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 15px;
    }

    .orders-grid {
      display: grid;
      gap: 18px;
    }

    .order-card {
      border: 1px solid #e5e5e5;
      border-radius: 16px;
      padding: 20px;
      background: #fff;
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .order-id {
      font-weight: bold;
      color: #087f46;
      font-size: 18px;
    }

    .status {
      padding: 6px 12px;
      border-radius: 20px;
      background: #fff3cd;
      font-size: 13px;
      font-weight: bold;
    }

    .customer-info {
      line-height: 1.7;
      color: #444;
    }

    .order-items {
      margin: 15px 0;
      padding: 15px;
      background: #f7faf8;
      border-radius: 12px;
    }

    .order-item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 0;
      border-bottom: 1px solid #e5e5e5;
    }

    .order-item:last-child {
      border-bottom: 0;
    }

    .order-total {
      font-size: 20px;
      font-weight: bold;
      color: #087f46;
      margin: 15px 0;
    }

    .order-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .order-actions button {
      border: 0;
      padding: 10px 14px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
    }

    .confirm-btn {
      background: #087f46;
      color: white;
    }

    .delivered-btn {
      background: #198754;
      color: white;
    }

    .cancel-btn {
      background: #dc3545;
      color: white;
    }

    .delete-btn {
      background: #333;
      color: white;
    }

    .empty-orders {
      text-align: center;
      padding: 35px;
      color: #777;
    }

    @media (max-width: 700px) {
      .admin-stats {
        grid-template-columns: 1fr;
      }

      .admin-section {
        padding: 18px;
      }

      .order-item {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <header class="admin-header">
    <h1>AC Retail Admin</h1>
    <p>Order Management Dashboard</p>
  </header>

  <main class="admin-container">

    <div class="admin-stats">
      <div class="stat-card">
        <h2 id="totalOrders">0</h2>
        <p>Total Orders</p>
      </div>

      <div class="stat-card">
        <h2 id="pendingOrders">0</h2>
        <p>Pending Orders</p>
      </div>

      <div class="stat-card">
        <h2 id="deliveredOrders">0</h2>
        <p>Delivered</p>
      </div>
    </div>
<section class="admin-section">
  <h2>💰 Weekly Price Manager</h2>

  <p style="color:#666;">
    Products की कीमत यहाँ check/update करके updated products.json export कर सकते हैं।
  </p>

  <input
    type="text"
    id="priceSearch"
    class="order-search"
    placeholder="Search product name..."
  >

  <div id="priceProducts"></div>

  <button
    id="exportPrices"
    style="
      margin-top:20px;
      width:100%;
      padding:14px;
      border:0;
      border-radius:12px;
      background:#087f46;
      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    "
  >
    📥 Export Updated products.json
  </button>
</section>
    <section class="admin-section">
      <h2>📦 Customer Orders</h2>

      <input
        type="text"
        id="orderSearch"
        class="order-search"
        placeholder="Search Order ID, customer name or mobile..."
      >

      <div id="ordersList" class="orders-grid"></div>
    </section>

  </main>

  <script src="admin.js"></script>

</body>
</html>
